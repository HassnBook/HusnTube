name: Build Android APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: rm -rf android && npx cap add android
      - run: python3 overlay/patch.py
      - name: google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then echo "::error::أضف Secret باسم GOOGLE_SERVICES_JSON (محتوى google-services.json)"; exit 1; fi
          printf '%s' "$GS" > android/app/google-services.json
      - name: fix MainActivity access + firebase dependency
        run: |
          F=android/app/src/main/java/com/husntube/app/MainActivity.java
          sed -i -E 's/protected void (onNewIntent|onStart|onStop|onResume)/public void \1/' "$F"
          grep -q "firebase-messaging:23" android/app/build.gradle || printf "\ndependencies {\n    implementation 'com.google.firebase:firebase-messaging:23.4.1'\n}\n" >> android/app/build.gradle
          grep -n "void on" "$F"
      - name: set applicationId from google-services.json
        run: |
          PKG=$(python3 -c "import json;print(json.load(open('android/app/google-services.json'))['client'][0]['client_info']['android_client_info']['package_name'])")
          echo "package: $PKG"
          sed -i -E "s/applicationId \"[^\"]+\"/applicationId \"$PKG\"/" android/app/build.gradle
          grep -n applicationId android/app/build.gradle
      - run: npx cap sync android
      - name: build apk
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain > ../build.log 2>&1 || { echo "=== COMPILE ERRORS ==="; grep -n -A4 "error:" ../build.log | head -80; echo "=== TAIL ==="; tail -25 ../build.log; exit 1; }
      - name: verify merged manifest
        run: |
          cd android && ./gradlew :app:processDebugMainManifest --no-daemon -q
          F=$(find app/build -path "*merged_manifests/debug*" -name AndroidManifest.xml | head -1); echo "$F"
          for k in HuMessagingService RECORD_AUDIO POST_NOTIFICATIONS CallActionReceiver; do grep -q "$k" "$F" || { echo "::error::$k مفقود في المانيفست النهائي"; exit 1; }; done
          grep -c "capacitorjs.plugins.pushnotifications.MessagingService" "$F" || true
      - uses: actions/upload-artifact@v4
        with:
          name: HusnTube-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
